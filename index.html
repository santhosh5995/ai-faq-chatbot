<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI FAQ Chatbot — Data Engineering, Python & SQL</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
  header { width: 100%; max-width: 760px; padding: 28px 20px 8px; text-align: center; }
  header h1 { font-size: 26px; color: #f8fafc; }
  header h1 span { color: #38bdf8; }
  header p { color: #94a3b8; font-size: 14px; margin-top: 6px; }
  #chat { width: 100%; max-width: 760px; flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 11px 14px; border-radius: 14px; line-height: 1.5; font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }
  .bot { background: #1e293b; align-self: flex-start; border-bottom-left-radius: 4px; }
  .user { background: #0369a1; color: #f0f9ff; align-self: flex-end; border-bottom-right-radius: 4px; }
  #chips { width: 100%; max-width: 760px; padding: 4px 20px 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: #1e293b; border: 1px solid #334155; color: #7dd3fc; padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; }
  .chip:hover { background: #334155; }
  #bar { width: 100%; max-width: 760px; padding: 0 20px 22px; display: flex; gap: 8px; }
  #input { flex: 1; padding: 13px 16px; border-radius: 999px; border: 1px solid #334155; background: #1e293b; color: #f1f5f9; font-size: 15px; outline: none; }
  #input:focus { border-color: #38bdf8; }
  #send { padding: 13px 22px; border-radius: 999px; border: none; background: #0284c7; color: white; font-size: 15px; font-weight: 600; cursor: pointer; }
  #send:hover { background: #0369a1; }
  footer { color: #64748b; font-size: 12px; padding-bottom: 14px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>🤖 AI FAQ <span>Chatbot</span></h1>
  <p>Ask me about data engineering, Python &amp; SQL — powered by a TF-IDF engine built from scratch. Runs 100% in your browser, no server, no API key.</p>
</header>
<div id="chat"></div>
<div id="chips"></div>
<div id="bar">
  <input id="input" type="text" placeholder="Ask a question… e.g. What is ETL?" autocomplete="off">
  <button id="send">Send</button>
</div>
<footer>By Santhosh Reddy Angiti · Same engine as the Python version on GitHub (ai-faq-chatbot)</footer>
<script>
const KB = [{"answer": "ETL stands for Extract, Transform, Load. It is the process of extracting data from source systems, transforming it (cleaning, joining, aggregating, and applying business rules), and loading it into a target system such as a data warehouse where it can be analyzed.", "keywords": ["extract", "transform", "load", "pipeline"], "question": "What is ETL?"}, {"answer": "The medallion architecture organizes data in a lakehouse into three layers of increasing quality. Bronze holds raw data exactly as it arrived, Silver holds cleaned and validated data, and Gold holds curated, business-ready tables and aggregates optimized for reporting and analytics.", "keywords": ["medallion", "bronze", "silver", "gold", "layers", "delta", "lakehouse"], "question": "What is the medallion architecture?"}, {"answer": "The main SQL join types are INNER JOIN (only matching rows from both tables), LEFT JOIN (all rows from the left table plus matches from the right), RIGHT JOIN (the reverse of LEFT), FULL OUTER JOIN (all rows from both tables), and CROSS JOIN (every combination of rows). Choosing the right join depends on whether unmatched rows should be kept or dropped.", "keywords": ["join", "joins", "inner", "left", "right", "full", "outer", "cross"], "question": "What are the types of SQL joins?"}, {"answer": "An index is a data structure, usually a B-tree, that lets the database find rows matching a column value without scanning the whole table. Indexes make reads and joins much faster, but they use extra storage and slow down inserts and updates slightly because the index must also be maintained.", "keywords": ["index", "indexes", "performance", "query", "speed", "btree"], "question": "What is a database index?"}, {"answer": "Normalization is the process of organizing tables so that each fact is stored in exactly one place, which reduces redundancy and prevents update anomalies. It is usually described in normal forms (1NF, 2NF, 3NF), where data is progressively split into related tables connected by keys.", "keywords": ["normalization", "normal", "forms", "redundancy", "1nf", "2nf", "3nf"], "question": "What is database normalization?"}, {"answer": "A list is mutable, meaning you can add, remove, or change its elements after creation, while a tuple is immutable and cannot be changed once created. Lists use square brackets and tuples use parentheses; tuples are slightly faster and can be used as dictionary keys because they are hashable.", "keywords": ["list", "tuple", "mutable", "immutable", "python"], "question": "What is the difference between a Python list and a tuple?"}, {"answer": "A decorator is a function that takes another function and returns a new function that adds behavior around it, using the @ syntax above the function definition. Decorators are commonly used for logging, timing, caching, and access checks without modifying the original function's code.", "keywords": ["decorator", "python", "wrapper", "function"], "question": "What is a Python decorator?"}, {"answer": "Pandas is a Python library for working with tabular data using DataFrames, which are like in-memory spreadsheets with labeled rows and columns. It is used to load data from files and databases, clean and transform it, run aggregations, and export results for analysis or reporting.", "keywords": ["pandas", "dataframe", "python", "analysis", "csv"], "question": "What is pandas used for?"}, {"answer": "Apache Airflow is an open-source platform for authoring, scheduling, and monitoring data pipelines as code. Workflows are written in Python as DAGs (directed acyclic graphs) of tasks, and Airflow handles retries, dependencies, backfills, and alerting.", "keywords": ["airflow", "orchestration", "dag", "scheduler", "workflow", "pipeline"], "question": "What is Apache Airflow?"}, {"answer": "Apache Kafka is a distributed event streaming platform that stores streams of records in topics on brokers. Producers publish events to topics and consumers read them, which makes Kafka useful for real-time data pipelines, event-driven systems, and decoupling services that exchange data.", "keywords": ["kafka", "streaming", "events", "producer", "consumer", "topic", "broker"], "question": "What is Apache Kafka?"}, {"answer": "A data warehouse stores structured, cleaned data in a predefined schema optimized for SQL analytics, while a data lake stores raw data in any format (structured, semi-structured, or unstructured) at low cost. Modern lakehouse designs combine both: raw storage with warehouse-style tables and governance on top.", "keywords": ["warehouse", "lake", "lakehouse", "structured", "storage"], "question": "What is the difference between a data warehouse and a data lake?"}, {"answer": "A star schema is a dimensional model with one central fact table containing measurable events (like sales amounts) surrounded by dimension tables describing who, what, where, and when. Its simple shape makes analytical queries fast and easy to write, which is why it is the standard for BI reporting.", "keywords": ["star", "schema", "fact", "dimension", "modeling", "warehouse"], "question": "What is a star schema?"}, {"answer": "A window function performs a calculation across a set of rows related to the current row, defined with the OVER clause and optional PARTITION BY and ORDER BY, without collapsing the rows like GROUP BY does. Common examples are ROW_NUMBER, RANK, LAG/LEAD, and running sums or averages.", "keywords": ["window", "function", "over", "partition", "row_number", "rank", "running"], "question": "What is a window function in SQL?"}, {"answer": "A primary key uniquely identifies each row in its own table and cannot contain NULL values. A foreign key is a column in another table that references a primary key, enforcing referential integrity so related rows cannot point to records that do not exist.", "keywords": ["primary", "foreign", "key", "constraint", "relation"], "question": "What is the difference between a primary key and a foreign key?"}, {"answer": "A REST API is a way for systems to communicate over HTTP using standard methods like GET, POST, PUT, and DELETE on resource URLs, typically exchanging JSON. It is stateless, meaning each request contains all the information the server needs, which makes REST APIs simple to scale and integrate.", "keywords": ["rest", "api", "http", "endpoint", "json", "get", "post"], "question": "What is a REST API?"}, {"answer": "Git is a distributed version control system that tracks changes to files over time. Developers commit snapshots of their work, branch to develop features safely, and merge changes back, so a team can collaborate on the same codebase with a full history of who changed what and why.", "keywords": ["git", "version", "control", "commit", "branch", "repository", "github"], "question": "What is Git used for?"}, {"answer": "Docker packages an application together with its dependencies into a container image that runs the same way on any machine. Containers are lighter than virtual machines because they share the host operating system kernel, and they make deploying and reproducing environments much more reliable.", "keywords": ["docker", "container", "image", "deployment"], "question": "What is Docker?"}, {"answer": "Unit testing means writing small automated tests that verify a single function or component behaves correctly in isolation. Tests catch regressions early, document expected behavior, and make refactoring safer; in Python they are commonly written with the built-in unittest module or pytest.", "keywords": ["unit", "testing", "test", "pytest", "unittest", "quality"], "question": "What is unit testing?"}, {"answer": "SQL databases are relational: they store data in tables with a fixed schema and support joins and ACID transactions. NoSQL databases (document, key-value, wide-column, graph) use flexible schemas and scale horizontally more easily, trading some consistency and join power for flexibility and throughput.", "keywords": ["sql", "nosql", "relational", "mongodb", "document", "scaling"], "question": "What is the difference between SQL and NoSQL databases?"}, {"answer": "Partitioning splits a large table or dataset into smaller physical pieces, usually by a column like date or region, while keeping it one logical table. Queries that filter on the partition column then only scan the relevant pieces, which greatly improves performance on large datasets.", "keywords": ["partitioning", "partition", "sharding", "performance", "split"], "question": "What is data partitioning?"}, {"answer": "DELETE removes rows one at a time (optionally with a WHERE clause) and can usually be rolled back. TRUNCATE quickly removes all rows from a table but keeps the table itself, and DROP removes the entire table, including its structure, from the database.", "keywords": ["delete", "truncate", "drop", "remove", "table"], "question": "What is the difference between DELETE, TRUNCATE, and DROP in SQL?"}, {"answer": "A slowly changing dimension (SCD) describes how a warehouse handles dimension attributes that change over time, such as a customer's address. Type 1 overwrites the old value, Type 2 keeps history by adding a new row for each change, and Type 3 keeps a limited history in extra columns.", "keywords": ["slowly", "changing", "dimension", "scd", "type", "history"], "question": "What is a slowly changing dimension?"}, {"answer": "Batch processing collects data over a period and processes it in scheduled chunks, which is simple and efficient for large volumes. Stream processing handles each event as it arrives, giving results in near real time at the cost of more complex infrastructure and state management.", "keywords": ["batch", "stream", "streaming", "realtime", "real-time", "processing"], "question": "What is the difference between batch and stream processing?"}, {"answer": "A CTE (common table expression) is a temporary named result set defined with the WITH keyword at the start of a query. CTEs make complex queries easier to read by breaking them into logical steps, and recursive CTEs can even walk hierarchical data like org charts.", "keywords": ["cte", "with", "common", "table", "expression", "query"], "question": "What is a CTE in SQL?"}];
const STOPWORDS = new Set(["a","an","the","is","are","was","were","be","been","am","what","why","how","when","where","which","who","whom","do","does","did","can","could","should","would","will","i","you","he","she","it","we","they","me","my","your","of","in","on","at","to","for","with","by","from","as","and","or","but","if","then","so","than","that","this","there","here","please","tell","explain","about","between","vs"]);
const INTENTS = [
  [["hello","hi","hey","namaste"], "Hello! I'm an FAQ chatbot for data engineering, Python, and SQL. Ask me a question, or tap one of the suggestions below."],
  [["thanks","thank","great","awesome","nice"], "You're welcome! Happy to help. Ask me anything else."],
  [["bye","goodbye","quit","exit"], "Goodbye! Good luck with your learning."]
];
const THRESHOLD = 0.12;
const HELP = "I can answer questions about data engineering, Python, and SQL. Try:\n• What is ETL?\n• Explain the medallion architecture\n• What are the types of SQL joins?\n• What is a window function in SQL?\n• What is the difference between a list and a tuple in Python?";

function tokenize(text) {
  return (text.toLowerCase().match(/[a-z0-9]+/g) || []).filter(w => !STOPWORDS.has(w));
}
const docs = KB.map(e => e.question + " " + (e.keywords || []).join(" "));
const tokenized = docs.map(tokenize);
const N = docs.length;
const df = {};
tokenized.forEach(toks => { new Set(toks).forEach(t => df[t] = (df[t] || 0) + 1); });
const idf = {};
for (const t in df) idf[t] = Math.log((1 + N) / (1 + df[t])) + 1.0;
function vectorize(tokens) {
  const counts = {};
  tokens.forEach(t => counts[t] = (counts[t] || 0) + 1);
  const keys = Object.keys(counts);
  if (!keys.length) return {};
  const max = Math.max(...keys.map(k => counts[k]));
  const vec = {};
  for (const t of keys) if (t in idf) vec[t] = (counts[t] / max) * idf[t];
  return vec;
}
const docVecs = tokenized.map(vectorize);
function cosine(a, b) {
  let dot = 0;
  for (const t in a) if (t in b) dot += a[t] * b[t];
  const na = Math.sqrt(Object.values(a).reduce((s, v) => s + v * v, 0));
  const nb = Math.sqrt(Object.values(b).reduce((s, v) => s + v * v, 0));
  return (na && nb) ? dot / (na * nb) : 0;
}
function answer(q) {
  const words = new Set(q.toLowerCase().match(/[a-z]+/g) || []);
  for (const [keys, reply] of INTENTS) if (keys.some(k => words.has(k))) return reply;
  if (words.has("help")) return HELP;
  const qv = vectorize(tokenize(q));
  const scored = docVecs.map((dv, i) => [cosine(qv, dv), i]).sort((x, y) => y[0] - x[0]);
  const [best, idx] = scored[0];
  if (best < THRESHOLD) {
    const s = scored.slice(0, 3).map(([, i]) => KB[i].question).join("; ");
    return "I don't know that yet — it's outside my knowledge base. Try asking about: " + s + ". Or type 'help' to see example questions.";
  }
  return KB[idx].answer;
}
const chat = document.getElementById('chat');
const input = document.getElementById('input');
function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
function send() {
  const q = input.value.trim();
  if (!q) return;
  addMsg(q, 'user'); input.value = '';
  setTimeout(() => addMsg(answer(q), 'bot'), 250);
}
document.getElementById('send').onclick = send;
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
const examples = ["What is ETL?", "Explain the medallion architecture", "What are the types of SQL joins?", "What is a window function in SQL?", "List vs tuple in Python?", "What is Apache Kafka?"];
const chips = document.getElementById('chips');
examples.forEach(ex => {
  const c = document.createElement('button');
  c.className = 'chip'; c.textContent = ex;
  c.onclick = () => { input.value = ex; send(); };
  chips.appendChild(c);
});
addMsg("Hello! I'm an FAQ chatbot for data engineering, Python, and SQL. Ask me a question, or tap one of the suggestions below.", 'bot');
input.focus();
</script>
</body>
</html>
